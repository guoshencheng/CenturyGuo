<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">B2 前：每帧 3 次 CPU↔GPU 同步阻塞</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#64748b">每次 waitUntilCompleted 期间 CPU 傻等，GPU 实际早就画完</text>

  <!-- CPU lane -->
  <rect x="80" y="90" width="80" height="50" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="120" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">CPU</text>
  <text x="120" y="130" text-anchor="middle" font-size="10" fill="#64748b">主控</text>

  <!-- GPU lane -->
  <rect x="80" y="240" width="80" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="120" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">GPU</text>
  <text x="120" y="280" text-anchor="middle" font-size="10" fill="#64748b">Metal 队列</text>

  <!-- Lane labels -->
  <text x="50" y="118" text-anchor="end" font-size="11" fill="#64748b">CPU</text>
  <text x="50" y="268" text-anchor="end" font-size="11" fill="#64748b">GPU</text>

  <!-- Time axis -->
  <line x1="180" y1="320" x2="860" y2="320" stroke="#cbd5e1" stroke-width="1"/>
  <g font-size="10" fill="#94a3b8">
    <text x="180" y="340" text-anchor="middle">t0</text>
    <text x="300" y="340" text-anchor="middle">t1</text>
    <text x="450" y="340" text-anchor="middle">t2</text>
    <text x="600" y="340" text-anchor="middle">t3</text>
    <text x="780" y="340" text-anchor="middle">t4</text>
    <text x="860" y="340" text-anchor="middle">t5</text>
  </g>

  <!-- CPU activity (top lane) -->
  <!-- t0-t1: work on render (Skia drawing) -->
  <rect x="180" y="95" width="120" height="40" fill="#3b82f6" opacity="0.7" rx="3"/>
  <text x="240" y="120" text-anchor="middle" font-size="11" fill="white" font-weight="600">Skia 画 HUD</text>

  <!-- t1-t2: WAIT (sync) -->
  <rect x="300" y="95" width="150" height="40" fill="#dc2626" opacity="0.85" rx="3"/>
  <text x="375" y="113" text-anchor="middle" font-size="11" fill="white" font-weight="700">wait ① 傻等</text>
  <text x="375" y="128" text-anchor="middle" font-size="9" fill="white">CPU 空转</text>

  <!-- t2-t3: work on downsample -->
  <rect x="450" y="95" width="80" height="40" fill="#3b82f6" opacity="0.7" rx="3"/>
  <text x="490" y="120" text-anchor="middle" font-size="11" fill="white" font-weight="600">降采样</text>

  <!-- t3-t4: WAIT (sync) -->
  <rect x="530" y="95" width="120" height="40" fill="#dc2626" opacity="0.85" rx="3"/>
  <text x="590" y="113" text-anchor="middle" font-size="11" fill="white" font-weight="700">wait ② 傻等</text>
  <text x="590" y="128" text-anchor="middle" font-size="9" fill="white">CPU 空转</text>

  <!-- t4-t5: work on composite -->
  <rect x="650" y="95" width="130" height="40" fill="#3b82f6" opacity="0.7" rx="3"/>
  <text x="715" y="120" text-anchor="middle" font-size="11" fill="white" font-weight="600">合成</text>

  <!-- t5+: WAIT (final sync) -->
  <rect x="780" y="95" width="80" height="40" fill="#dc2626" opacity="0.55" rx="3"/>
  <text x="820" y="118" text-anchor="middle" font-size="10" fill="white" font-weight="700">wait ③</text>

  <!-- GPU activity (bottom lane) -->
  <rect x="180" y="245" width="200" height="40" fill="#d97706" opacity="0.6" rx="3"/>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="white" font-weight="600">render</text>

  <rect x="380" y="245" width="150" height="40" fill="#d97706" opacity="0.6" rx="3"/>
  <text x="455" y="270" text-anchor="middle" font-size="11" fill="white" font-weight="600">downsample</text>

  <rect x="530" y="245" width="200" height="40" fill="#d97706" opacity="0.6" rx="3"/>
  <text x="630" y="270" text-anchor="middle" font-size="11" fill="white" font-weight="600">composite</text>

  <!-- Arrow showing 队列保序 -->
  <text x="450" y="200" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">↓ 同一 Metal command queue，GPU 实际在 t2 就画完 render 并自动开始 downsample</text>
</svg>
