<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">B2 后：每帧 1 次同步阻塞（末尾）</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#64748b">中间两次 wait 去掉，靠 Metal 队列保序；CPU 准备数据，GPU 一直画</text>

  <!-- CPU lane -->
  <rect x="80" y="90" width="80" height="50" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="120" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">CPU</text>
  <text x="120" y="130" text-anchor="middle" font-size="11" fill="#64748b">主控</text>

  <!-- GPU lane -->
  <rect x="80" y="240" width="80" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="120" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">GPU</text>
  <text x="120" y="280" text-anchor="middle" font-size="10" fill="#64748b">Metal 队列</text>

  <text x="50" y="118" text-anchor="end" font-size="11" fill="#64748b">CPU</text>
  <text x="50" y="268" text-anchor="end" font-size="11" fill="#64748b">GPU</text>

  <!-- Time axis -->
  <line x1="180" y1="320" x2="860" y2="320" stroke="#cbd5e1" stroke-width="1"/>
  <g font-size="10" fill="#94a3b8">
    <text x="180" y="340" text-anchor="middle">t0</text>
    <text x="280" y="340" text-anchor="middle">t1</text>
    <text x="380" y="340" text-anchor="middle">t2</text>
    <text x="480" y="340" text-anchor="middle">t3</text>
    <text x="580" y="340" text-anchor="middle">t4</text>
    <text x="780" y="340" text-anchor="middle">t5</text>
  </g>

  <!-- CPU activity - now no idle waits -->
  <rect x="180" y="95" width="120" height="40" fill="#3b82f6" opacity="0.7" rx="3"/>
  <text x="240" y="120" text-anchor="middle" font-size="11" fill="white" font-weight="600">Skia 画 HUD</text>

  <!-- Skia flush is non-blocking, so CPU continues immediately -->
  <rect x="300" y="95" width="100" height="40" fill="#3b82f6" opacity="0.7" rx="3"/>
  <text x="350" y="120" text-anchor="middle" font-size="11" fill="white" font-weight="600">降采样</text>

  <rect x="400" y="95" width="120" height="40" fill="#3b82f6" opacity="0.7" rx="3"/>
  <text x="460" y="120" text-anchor="middle" font-size="11" fill="white" font-weight="600">合成</text>

  <!-- CPU continues preparing next frame's data while GPU finishes -->
  <rect x="520" y="95" width="220" height="40" fill="#10b981" opacity="0.6" rx="3"/>
  <text x="630" y="118" text-anchor="middle" font-size="11" fill="white" font-weight="600">准备下一帧</text>
  <text x="630" y="130" text-anchor="middle" font-size="9" fill="white">CPU 干活，不再空等</text>

  <!-- Final sync -->
  <rect x="740" y="95" width="100" height="40" fill="#dc2626" opacity="0.85" rx="3"/>
  <text x="790" y="113" text-anchor="middle" font-size="11" fill="white" font-weight="700">wait ① 末尾</text>
  <text x="790" y="128" text-anchor="middle" font-size="9" fill="white">取结果</text>

  <!-- GPU activity -->
  <rect x="180" y="245" width="200" height="40" fill="#d97706" opacity="0.6" rx="3"/>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="white" font-weight="600">render</text>

  <rect x="380" y="245" width="150" height="40" fill="#d97706" opacity="0.6" rx="3"/>
  <text x="455" y="270" text-anchor="middle" font-size="11" fill="white" font-weight="600">downsample</text>

  <rect x="530" y="245" width="200" height="40" fill="#d97706" opacity="0.6" rx="3"/>
  <text x="630" y="270" text-anchor="middle" font-size="11" fill="white" font-weight="600">composite</text>

  <text x="450" y="200" text-anchor="middle" font-size="11" fill="#059669" font-style="italic" font-weight="600">↓ 关键：CPU 准备下一帧数据时，GPU 还在画上一帧的最后一段</text>
</svg>
