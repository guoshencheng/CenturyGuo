<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">原生架构的导出管线（v2）：单线程串行循环</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#64748b">每帧走完所有 stage 才进下一帧，三种硬件轮流空转</text>

  <!-- 6 stages -->
  <g>
    <rect x="20" y="90" width="125" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="82" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">解码</text>
    <text x="82" y="142" text-anchor="middle" font-size="11" fill="#64748b">ASIC · 0.8s</text>
  </g>
  <g>
    <rect x="170" y="90" width="125" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="232" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">渲染 HUD</text>
    <text x="232" y="142" text-anchor="middle" font-size="11" fill="#64748b">GPU · 113s</text>
  </g>
  <g>
    <rect x="320" y="90" width="125" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="382" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">降采样</text>
    <text x="382" y="142" text-anchor="middle" font-size="11" fill="#64748b">GPU · 0.4s</text>
  </g>
  <g>
    <rect x="470" y="90" width="125" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="532" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">分配输出</text>
    <text x="532" y="142" text-anchor="middle" font-size="11" fill="#64748b">CPU · 2s</text>
  </g>
  <g>
    <rect x="620" y="90" width="125" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="682" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">合成</text>
    <text x="682" y="142" text-anchor="middle" font-size="11" fill="#64748b">GPU · 117s</text>
  </g>
  <g>
    <rect x="770" y="90" width="110" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="825" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">编码</text>
    <text x="825" y="142" text-anchor="middle" font-size="11" fill="#64748b">ASIC · 62s</text>
  </g>

  <!-- Forward arrows -->
  <line x1="145" y1="125" x2="167" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="295" y1="125" x2="317" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="445" y1="125" x2="467" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="595" y1="125" x2="617" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="745" y1="125" x2="767" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop arrow -->
  <path d="M 825 165 Q 825 230 450 230 Q 82 230 82 165" stroke="#d97706" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>
  <text x="450" y="260" text-anchor="middle" font-size="12" fill="#d97706" font-weight="600">单线程循环 × 26912 帧</text>
  <text x="450" y="280" text-anchor="middle" font-size="11" fill="#64748b">总墙钟 ≈ 295s（约 4 分 55 秒）</text>
</svg>
