<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">装完计时，三段耗时真实分布</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#64748b">GPU 占 78% — 真正的瓶颈在 GPU 内部（render + composite 都是 3× 超采样）</text>

  <!-- Axis -->
  <line x1="180" y1="100" x2="180" y2="320" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="180" y1="320" x2="860" y2="320" stroke="#cbd5e1" stroke-width="1"/>
  <text x="175" y="105" text-anchor="end" font-size="11" fill="#64748b">s</text>

  <!-- Tick marks -->
  <g font-size="10" fill="#94a3b8">
    <line x1="180" y1="320" x2="180" y2="325" stroke="#cbd5e1"/>
    <line x1="260" y1="320" x2="260" y2="325" stroke="#cbd5e1"/>
    <line x1="340" y1="320" x2="340" y2="325" stroke="#cbd5e1"/>
    <line x1="420" y1="320" x2="420" y2="325" stroke="#cbd5e1"/>
    <line x1="500" y1="320" x2="500" y2="325" stroke="#cbd5e1"/>
    <line x1="580" y1="320" x2="580" y2="325" stroke="#cbd5e1"/>
    <line x1="660" y1="320" x2="660" y2="325" stroke="#cbd5e1"/>
    <line x1="740" y1="320" x2="740" y2="325" stroke="#cbd5e1"/>
    <line x1="820" y1="320" x2="820" y2="325" stroke="#cbd5e1"/>
    <text x="180" y="338" text-anchor="middle">0</text>
    <text x="260" y="338" text-anchor="middle">50</text>
    <text x="340" y="338" text-anchor="middle">100</text>
    <text x="420" y="338" text-anchor="middle">150</text>
    <text x="500" y="338" text-anchor="middle">200</text>
    <text x="580" y="338" text-anchor="middle">250</text>
    <text x="660" y="338" text-anchor="middle">300</text>
    <text x="740" y="338" text-anchor="middle">350</text>
    <text x="820" y="338" text-anchor="middle">400</text>
  </g>

  <!-- Bar 1: decode 0.8s (small) -->
  <text x="170" y="135" text-anchor="end" font-size="13" font-weight="600" fill="#1e293b">decode</text>
  <text x="170" y="150" text-anchor="end" font-size="10" fill="#64748b">ASIC</text>
  <rect x="180" y="120" width="3" height="30" fill="#059669" rx="2"/>
  <text x="190" y="140" font-size="12" fill="#1e293b" font-weight="600">0.8s</text>

  <!-- Bar 2: GPU 230s (huge) -->
  <text x="170" y="200" text-anchor="end" font-size="13" font-weight="600" fill="#1e293b">GPU</text>
  <text x="170" y="215" text-anchor="end" font-size="10" fill="#64748b">Metal</text>
  <rect x="180" y="180" width="650" height="30" fill="#d97706" rx="2"/>
  <text x="195" y="200" font-size="13" fill="white" font-weight="700">230s ← 瓶颈（78%）</text>

  <!-- Bar 3: encode 62s -->
  <text x="170" y="265" text-anchor="end" font-size="13" font-weight="600" fill="#1e293b">encode</text>
  <text x="170" y="280" text-anchor="end" font-size="10" fill="#64748b">ASIC</text>
  <rect x="180" y="245" width="175" height="30" fill="#059669" rx="2"/>
  <text x="365" y="265" font-size="12" fill="#1e293b" font-weight="600">62s</text>

  <!-- 串行累计 = 295s annotation -->
  <line x1="830" y1="320" x2="830" y2="345" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="830" y="358" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">串行累计 = 295s</text>
</svg>
