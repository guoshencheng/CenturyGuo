<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">音频合并：从"重编码整段视频"到"拷流 mux"</text>

  <!-- Top: BEFORE -->
  <g>
    <text x="30" y="68" font-size="14" font-weight="700" fill="#dc2626">BEFORE · AVAssetExportPresetHighestQuality</text>
    <text x="30" y="85" font-size="11" fill="#64748b">3 分 44 秒（224s）— 把已经编码好的视频再编一遍</text>

    <!-- temp video -->
    <rect x="30" y="100" width="160" height="50" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="110" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">temp 视频</text>
    <text x="110" y="138" text-anchor="middle" font-size="10" fill="#64748b">H.264 已编码</text>

    <!-- source audio -->
    <rect x="30" y="160" width="160" height="40" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="110" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">原视频音轨</text>
    <text x="110" y="194" text-anchor="middle" font-size="10" fill="#64748b">AAC</text>

    <!-- AVAssetExportSession (big red) -->
    <rect x="280" y="100" width="320" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="440" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">AVAssetExportSession</text>
    <text x="440" y="150" text-anchor="middle" font-size="12" fill="#1e293b">HighestQuality preset</text>
    <text x="440" y="170" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">重编码整段视频（18 分钟 → 224s）</text>
    <text x="440" y="188" text-anchor="middle" font-size="10" fill="#64748b">CPU 软件编码 · 全帧重压一遍</text>

    <!-- output -->
    <rect x="700" y="125" width="160" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="780" y="147" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">最终 .mp4</text>
    <text x="780" y="163" text-anchor="middle" font-size="10" fill="#059669" font-weight="600">3 分 44 秒</text>

    <!-- arrows -->
    <line x1="190" y1="125" x2="278" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arr3)"/>
    <line x1="190" y1="180" x2="278" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arr3)"/>
    <line x1="600" y1="150" x2="698" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arr3)"/>
  </g>

  <!-- Divider -->
  <line x1="30" y1="240" x2="870" y2="240" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Bottom: AFTER -->
  <g>
    <text x="30" y="270" font-size="14" font-weight="700" fill="#059669">AFTER · AVAssetExportPresetPassthrough</text>
    <text x="30" y="287" font-size="11" fill="#64748b">几秒 — 直接拷流 + 重新打包容器，不动一帧像素</text>

    <!-- temp video -->
    <rect x="30" y="305" width="160" height="50" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="110" y="327" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">temp 视频</text>
    <text x="110" y="343" text-anchor="middle" font-size="10" fill="#64748b">H.264 已编码</text>

    <!-- source audio -->
    <rect x="30" y="365" width="160" height="40" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="110" y="385" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">原视频音轨</text>
    <text x="110" y="399" text-anchor="middle" font-size="10" fill="#64748b">AAC</text>

    <!-- Passthrough box -->
    <rect x="280" y="305" width="320" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="440" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">AVAssetExportSession</text>
    <text x="440" y="355" text-anchor="middle" font-size="12" fill="#1e293b">Passthrough preset</text>
    <text x="440" y="375" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">视频流直接拷贝、只 mux 音频轨</text>
    <text x="440" y="393" text-anchor="middle" font-size="10" fill="#64748b">纯 IO 操作 · 不动一帧像素</text>

    <!-- output -->
    <rect x="700" y="330" width="160" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="780" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">最终 .mp4</text>
    <text x="780" y="368" text-anchor="middle" font-size="10" fill="#059669" font-weight="600">几秒</text>

    <!-- arrows -->
    <line x1="190" y1="330" x2="278" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#arr3)"/>
    <line x1="190" y1="385" x2="278" y2="385" stroke="#475569" stroke-width="2" marker-end="url(#arr3)"/>
    <line x1="600" y1="355" x2="698" y2="355" stroke="#475569" stroke-width="2" marker-end="url(#arr3)"/>
  </g>
</svg>
